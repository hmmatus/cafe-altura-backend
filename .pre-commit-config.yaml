default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-format
        stages: [pre-commit]
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: architecture-boundaries
        name: clean architecture boundaries
        entry: scripts/check_architecture.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: django-tests
        name: django tests
        entry: .venv/bin/python manage.py test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
